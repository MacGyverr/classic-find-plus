<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.classicfind.Plus.Search"/>
  </policy>
  <policy context="default">
    <deny own="org.classicfind.Plus.Search"/>
    <allow send_destination="org.classicfind.Plus.Search" send_interface="org.classicfind.Plus.Search"/>
    <allow send_destination="org.classicfind.Plus.Search" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.classicfind.Plus.Search" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
